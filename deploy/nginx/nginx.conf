# Nginx front-end for the local Troupe deployment.
# Mounted read-only at /etc/nginx/nginx.conf.
#
# Two things here are non-obvious and must not be "simplified":
#
#  1. SSE streaming. Chat responses are text/event-stream. `proxy_buffering off`
#     plus `proxy_read_timeout` sized to the longest expected agent run — the
#     default 60s read timeout silently truncates long streams. gzip must be off
#     for these paths: compressing a stream defeats incremental delivery.
#
#     The app already emits `X-Accel-Buffering: no` on every streaming handler
#     (pkg/api/chat_handlers.go:694, run_handler.go:744, flow_run_handler.go:76,
#     app_data_handler.go:274, fleet_session_handlers.go:872), which nginx honours
#     per-response. The config below is belt-and-braces on top of that.
#
#     Why one broad `/api/` prefix instead of a regex on known SSE paths: the
#     real routes are unpredictable — the main chat stream is `/api/chat` with
#     NO trailing slash and fleet streams live under `/api/fleet-plans/...`
#     (pkg/api/handlers.go:1262, :1359). A `^/api/(chat|fleet)/` style regex
#     misses both.
#
#  2. X-Forwarded-Proto. The app decides whether to set the Secure flag on its
#     auth cookies from this header (pkg/api/auth_platform.go:1019-1024). Setting
#     it to "https" while actually serving plain HTTP makes browsers drop the
#     cookie and you get a login loop. Keep it "http" unless TLS really
#     terminates here.

user  nginx;
worker_processes auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $http_host [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    server_tokens      off;

    # Uploads and large artifacts (flow exports, memory files).
    client_max_body_size 256m;

    # ---- Proxy defaults ----------------------------------------------------
    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    # Size these to the longest single agent turn you intend to tolerate; a
    # trailing step can idle while tools run.
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;

    upstream troupe_app {
        # Compose service DNS name. Single replica today; max_fails=0 keeps any
        # cold-start delay from marking the upstream down, and least_conn would
        # matter if you ever scale out.
        server troupe:9393 max_fails=0;
        keepalive 32;
    }

    server {
        # IPv6 listener intentionally omitted: most Docker networks have IPv6
        # disabled and `listen [::]:80` then aborts startup with
        # "socket() [::]:80 failed (97: Address family not supported)".
        listen 80;
        server_name _;

        # ---- API + SSE: never buffer, never compress ---------------------
        location /api/ {
            proxy_pass http://troupe_app;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;

            proxy_buffering          off;
            proxy_request_buffering  off;
            proxy_cache              off;
            chunked_transfer_encoding on;
            gzip                     off;
            proxy_read_timeout       3600s;
            proxy_send_timeout       3600s;
        }

        # OAuth/OIDC discovery endpoints (pkg/launcher/studio.go:268-269).
        location /.well-known/ {
            proxy_pass http://troupe_app;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
        }

        location /oauth/ {
            proxy_pass http://troupe_app;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
        }

        # ---- SPA static assets: safe to compress --------------------------
        location / {
            gzip on;
            gzip_types text/css application/javascript application/json image/svg+xml;
            gzip_min_length 1024;

            proxy_pass http://troupe_app;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
            proxy_set_header Connection "";
        }

        # Upstream liveness probe (maps to the app's unauthenticated healthz).
        location = /healthz-upstream {
            access_log off;
            proxy_pass http://troupe_app/api/healthz;
        }
    }

    # ---------------------------------------------------------------------
    # Optional HTTPS with a self-signed certificate.
    #
    #   openssl req -x509 -newkey rsa:2048 -nodes -days 365 \
    #     -keyout deploy/nginx/certs/tls.key -out deploy/nginx/certs/tls.crt \
    #     -subj "/CN=troupe.local" \
    #     -addext "subjectAltName=DNS:troupe.local"
    #
    # Then publish 443 (see the commented ports in compose.yaml) and use
    # X-Forwarded-Proto https — only now is that correct, as it flips the auth
    # cookie to Secure.
    #
    # server {
    #     listen 443 ssl;
    #     http2 on;
    #     server_name troupe.local;
    #
    #     ssl_certificate     /etc/nginx/certs/tls.crt;
    #     ssl_certificate_key /etc/nginx/certs/tls.key;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #
    #     location /api/ {
    #         proxy_pass http://troupe_app;
    #         proxy_set_header Host              $host;
    #         proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto https;
    #         proxy_buffering off;
    #         gzip off;
    #         proxy_read_timeout 3600s;
    #     }
    #
    #     location / {
    #         proxy_pass http://troupe_app;
    #         proxy_set_header Host              $host;
    #         proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto https;
    #     }
    # }
}
