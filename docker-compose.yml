services:
  astonish:
    build:
      context: .
      dockerfile: docker/astonish/Dockerfile
    image: astonish:latest
    command: ["studio"]
    ports:
      - "9393:9393"
    volumes:
      # Map local data directory to container's config path
      # We use .troupe-data in the current directory to store persistent data
      - ./.troupe-data:/root/.config/astonish
    environment:
      # Optional: Override host if needed, but defaults work fine
      - TROUPE_HOST=0.0.0.0
    restart: unless-stopped
